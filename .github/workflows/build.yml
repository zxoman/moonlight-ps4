name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-test:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Protocol checks (Python)
        run: python tests/test_protocol.py
        *Verification:* Protocol test script exits cleanly with code 0.

      - name: Build and test protocol core
        run: make -f Makefile.host test cli
        *Verification:* Host binaries build and pass local unit tests.

      - name: Smoke UI path
        run: ./build-host/moonlight-host --ui || true

      - name: Upload host binary
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-host-linux
          path: build-host/moonlight-host

  ps4-pkg:
    name: PS4 PKG (OpenOrbis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make wget unzip libarchive-tools clang lld

      - name: Download and Setup OpenOrbis Toolchain
        run: |
          echo "Downloading OpenOrbis PS4 Toolchain..."
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain-linux.tar.gz -O toolchain.tar.gz || \
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/archive/refs/heads/master.zip -O toolchain.zip && unzip -q toolchain.zip
          
          # Set up environment path variable for the compiler
          echo "OO_PS4_TOOLCHAIN=${{ github.workspace }}/OpenOrbis-PS4-Toolchain-master" >> $GITHUB_ENV

      - name: Build eboot and PKG
        run: |
          make
        env:
          OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis-PS4-Toolchain-master
        *Verification:* Makefile executes compilation steps and outputs target binary files.

      - name: Verify PKG Generation
        run: |
          ls -la *.pkg || echo "No .pkg file found in root directory"
          ls -la build/ || echo "Checking build directory..."
        *Verification:* Ensure `.pkg` or application payload files exist.

      - name: Upload PKG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-ps4-pkg
          path: |
            *.pkg
            **/$*.pkg
            eboot.bin
          if-no-files-found: warn
