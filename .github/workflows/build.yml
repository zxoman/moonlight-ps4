name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-test:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Protocol checks (Python)
        run: python tests/test_protocol.py

      - name: Build and test protocol core
        run: make -f Makefile.host test cli

      - name: Smoke UI path
        run: ./build-host/moonlight-host --ui || true

      - name: Upload host binary
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-host-linux
          path: build-host/moonlight-host

  ps4-pkg:
    name: PS4 PKG (OpenOrbis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make wget unzip libarchive-tools clang lld git curl

      - name: Setup OpenOrbis Toolchain
        run: |
          mkdir -p ~/ps4dev/OpenOrbis
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git ~/ps4dev/OpenOrbis/PS4Toolchain
          echo "OO_PS4_TOOLCHAIN=$HOME/ps4dev/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV

      - name: Build eboot and PKG via Makefile
        run: |
          make
        env:
          OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis/PS4Toolchain || $HOME/ps4dev/OpenOrbis/PS4Toolchain

      - name: Verify PKG Generation
        run: |
          ls -la *.pkg || echo "No .pkg file found in root directory"
          ls -la build/ || echo "Checking build directory..."

      - name: Upload PKG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-ps4-pkg
          path: |
            *.pkg
            build/*.pkg
            eboot.bin
          if-no-files-found: warn
