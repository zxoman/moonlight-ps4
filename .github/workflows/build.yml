name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-test:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Protocol checks (Python)
        run: python tests/test_protocol.py

      - name: Build and test protocol core
        run: make -f Makefile.host test cli

      - name: Smoke UI path
        run: ./build-host/moonlight-host --ui || true

      - name: Upload host binary
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-host-linux
          path: build-host/moonlight-host

  ps4-pkg:
    name: PS4 PKG (OpenOrbis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make wget unzip libarchive-tools clang lld

      - name: Download and Setup OpenOrbis Toolchain Release
        run: |
          echo "Downloading official OpenOrbis pre-built toolchain..."
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain-linux.tar.gz -O toolchain.tar.gz || \
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.2/toolchain-linux.tar.gz -O toolchain.tar.gz
          
          mkdir -p OpenOrbis-Toolchain
          tar -xzf toolchain.tar.gz -C OpenOrbis-Toolchain
          
          # Set paths so make can find orbis-clang and SDK libraries
          echo "OO_PS4_TOOLCHAIN=${{ github.workspace }}/OpenOrbis-Toolchain" >> $GITHUB_ENV
          echo "${{ github.workspace }}/OpenOrbis-Toolchain/bin" >> $GITHUB_PATH

      - name: Build eboot and PKG
        run: make
        env:
          OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis-Toolchain

      - name: Verify PKG Generation
        run: |
          ls -la *.pkg || echo "No .pkg file found in root directory"
          ls -la build/ || echo "Checking build directory..."

      - name: Upload PKG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-ps4-pkg
          path: |
            *.pkg
            **/$*.pkg
            eboot.bin
          if-no-files-found: warn
