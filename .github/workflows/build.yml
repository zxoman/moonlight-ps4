name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-test:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Protocol checks (Python)
        run: python tests/test_protocol.py

      - name: Build and test protocol core
        run: make -f Makefile.host test cli

      - name: Smoke UI path
        run: ./build-host/moonlight-host --ui || true

      - name: Upload host binary
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-host-linux
          path: build-host/moonlight-host

  ps4-pkg:
    name: PS4 PKG (OpenOrbis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make wget unzip libarchive-tools clang lld cmake ninja-build git curl libssl-dev

      - name: Setup OpenOrbis Toolchain
        run: |
          mkdir -p ~/ps4dev/OpenOrbis
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git ~/ps4dev/OpenOrbis/PS4Toolchain
          echo "OO_PS4_TOOLCHAIN=$HOME/ps4dev/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV

      - name: Setup Dependencies and Build FFmpeg for PS4
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup_deps.sh
          ./scripts/build_ffmpeg_ps4.sh

      - name: Build PS4 Package (.pkg)
        run: |
          ./scripts/build_pkg.sh

      - name: Upload PKG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-ps4-pkg
          path: |
            build-ps4/*.pkg
            *.pkg
          if-no-files-found: error
