name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Host tests + CLI
        run: make -f Makefile.host test cli

  ps4-pkg:
    name: PS4 PKG
    runs-on: ubuntu-22.04
    needs: host-tests

    env:
      GH_TOKEN: ${{ github.token }}
      # PkgTool.Core is an old .NET app: let it run on a newer runtime
      DOTNET_ROLL_FORWARD: Major
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install clang / lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make

      - name: Setup .NET (needed by PkgTool.Core)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download OpenOrbis toolchain (latest release)
        run: |
          mkdir -p "$RUNNER_TEMP/oo"
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain \
            --pattern '*.tar.gz' --dir "$RUNNER_TEMP/oo"
          ls -la "$RUNNER_TEMP/oo"
          for f in "$RUNNER_TEMP"/oo/*.tar.gz; do
            tar -xzf "$f" -C "$RUNNER_TEMP/oo"
          done
          # locate the toolchain root (the folder that contains link.x)
          LINKX=$(find "$RUNNER_TEMP/oo" -name link.x | head -n1)
          if [ -z "$LINKX" ]; then
            echo "link.x not found - check the release asset layout"
            find "$RUNNER_TEMP/oo" -maxdepth 3
            exit 1
          fi
          ROOT=$(dirname "$LINKX")
          chmod +x "$ROOT"/bin/linux/* || true
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> "$GITHUB_ENV"
          echo "Toolchain: $ROOT"

      - name: Check required files
        run: |
          test -f sce_sys/icon0.png || { echo "sce_sys/icon0.png missing"; exit 1; }
          ls "$OO_PS4_TOOLCHAIN/bin/linux"

      - name: Build PKG
        run: make

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-ps4-pkg
          path: "*.pkg"
          if-no-files-found: error
